<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desarrollo del Intestino Primitivo</title>
    <link rel="icon" href="logotipo.ico" type="image/x-icon">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <!-- HERO BANNER -->
        <section class="hero-banner theme-salud-activa" id="Inicio">
            
            <!-- Blobs Dinámicos -->
            <div id="hero-blob-1" class="hero-blob blob-sa-1"></div>
            <div id="hero-blob-2" class="hero-blob blob-sa-2"></div>
            <div id="hero-blob-3" class="hero-blob blob-sa-3"></div>

            <div class="hero-container container">
                
                <div class="hero-text-content" id="hero-text-container">
                    
                    <div class="hero-badge" id="hero-badge">
                        <span class="material-symbols-outlined text-[18px]" id="hero-badge-icon">ecg_heart</span>
                        <span id="hero-badge-text">ECOSISTEMA</span>
                    </div>

                    <h1 class="hero-title">
                        <span class="title-dark" id="hero-title-dark">Salud</span><br>
                        <div class="title-gradient-wrapper">
                            <span class="title-gradient" id="hero-title-gradient">Activa</span>
                            <!-- Destello SVG decorativo -->
                            <svg class="hero-sparkle" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="0" y="15" width="12" height="4" rx="2" fill="#3b82f6" transform="rotate(-30 0 15)"/>
                                <rect x="15" y="18" width="12" height="4" rx="2" fill="#22c55e"/>
                                <rect x="5" y="25" width="12" height="4" rx="2" fill="#d946ef" transform="rotate(30 5 25)"/>
                            </svg>
                        </div>
                    </h1>

                    <p class="hero-subtitle" id="hero-subtitle">
                        Ecosistema Salud Activa
                    </p>

                    <!-- NUEVAS PÍLDORAS / OPCIONES -->
                    <div class="hero-pills">
                        <div class="hero-pill active-pill" onclick="changeHeroEcosystem('salud_activa')" id="pill-salud_activa">
                            <span class="material-symbols-outlined">favorite</span> Salud Activa
                        </div>
                        <div class="hero-pill" onclick="changeHeroEcosystem('apuntes_uni')" id="pill-apuntes_uni">
                            <span class="material-symbols-outlined">school</span> Apuntes Uni
                        </div>
                        <div class="hero-pill" onclick="changeHeroEcosystem('primeros_pasos')" id="pill-primeros_pasos">
                            <span class="material-symbols-outlined">menu_book</span> Apuntes Uni, primeros pasos
                        </div>
                    </div>

                    <div id="hero-sub-features-container" class="mt-8 w-full flex justify-center fade-content">
                        <!-- El contenido de "Nutrición, Pasos..." se inyectará aquí vía JS -->
                    </div>

                    <div class="hero-brand-legend mt-6">
                        <span class="text-sm font-medium opacity-70">Ecosistema Salud Activa <span class="font-bold text-blue-500 tracking-wide">| By Brayan Santos</span></span>
                    </div>

                </div>

                <!-- Contenedor de Gráficos 3D Dinámicos -->
                <div class="hero-graphics" id="hero-graphics-container">
                    <!-- Se inyectan dinámicamente vía JavaScript -->
                </div>
            </div>
        </section>
        <!-- Script Principal -->
        <script src="script_bienvenida.js"></script>
    </body>
</html>
