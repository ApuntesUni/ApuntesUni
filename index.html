<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desarrollo del Intestino Primitivo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen font-sans p-4 md:p-8 text-slate-800 bg-gradient-to-t from-[#8bbcf9] via-white to-white bg-fixed bg-no-repeat">
    
    <!-- Encabezado -->
    <header class="max-w-5xl mx-auto mb-8 text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight mb-2">
            Desarrollo del Intestino Primitivo
        </h1>
        <p class="text-slate-600 max-w-2xl mx-auto">
            Basado en <i>Langman, Embriología Médica</i>. Maqueta del intestino anterior, medio, posterior y sus anomalías congénitas.
        </p>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-5xl mx-auto bg-white/40 backdrop-blur-lg rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.1)] overflow-hidden border border-white/60">
        
        <!-- Barra de Navegación -->
        <div class="flex flex-wrap border-b border-white/50 bg-white/20">
            <button id="btn-desarrollo" class="flex-1 py-4 px-6 text-sm font-bold flex items-center justify-center transition-colors bg-white/60 text-indigo-700 border-b-2 border-indigo-700 shadow-sm">
                <i data-lucide="book-open" class="w-5 h-5 mr-2"></i>
                Desarrollo Embrionario
            </button>
            <button id="btn-malformaciones" class="flex-1 py-4 px-6 text-sm font-bold flex items-center justify-center transition-colors text-slate-600 hover:text-slate-800 hover:bg-white/40">
                <i data-lucide="alert-triangle" class="w-5 h-5 mr-2"></i>
                Malformaciones Clínicas
            </button>
        </div>

        <div id="app-content" class="p-6 md:p-8">
            <!-- Contenido inyectado -->
        </div>
    </main>

    <footer class="max-w-5xl mx-auto mt-8 text-center text-slate-500 text-sm">
        <p>Bibliografia: Embriología Médica, Langman</p>
    </footer>

    <!-- Script Principal -->
    <script src="script.js"></script>
    <!-- Modal / Lightbox -->
    <div id="anomaly-modal" class="fixed inset-0 z-50 hidden bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-[#93c5fd]/30 backdrop-blur-xl rounded-3xl shadow-[0_8px_32px_0_rgba(31,38,135,0.37)] w-full max-w-5xl max-h-[90vh] overflow-hidden flex flex-col relative transform scale-95 transition-transform duration-300 border border-white/40 text-slate-900" id="modal-content-container">
            
            <!-- Botón de cierre estilizado -->
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-white/40 hover:bg-white/60 backdrop-blur-md p-2 rounded-full text-slate-800 transition-colors border border-white/50 shadow-sm">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <!-- Contenido del Modal (Fondo translúcido integrado) -->
            <div class="p-6 border-b border-white/30 bg-white/10 backdrop-blur-md">
                <h3 id="modal-title" class="text-2xl font-bold text-slate-900">Nombre de Anomalía</h3>
                <p id="modal-desc" class="text-slate-700 mt-2 font-medium">Descripción detallada.</p>
            </div>

            <div class="flex flex-col lg:flex-row flex-1 overflow-auto bg-transparent">
                <!-- Imagen Expandida -->
                <div class="flex-1 p-6 flex items-center justify-center bg-white/10 backdrop-blur-sm border-r border-white/30">
                    <img id="modal-img" src="" alt="Malformación" class="max-w-full max-h-[40vh] lg:max-h-[60vh] object-contain rounded-2xl shadow-lg border border-white/30">
                </div>
                
                <!-- Lienzo 3D Interactivo -->
                <div class="flex-1 p-0 relative min-h-[300px] lg:min-h-0 bg-slate-900/40 backdrop-blur-md" id="canvas-container">
                    <div class="absolute top-4 left-4 z-10 bg-white/20 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-md border border-white/30 shadow-sm">
                        <i data-lucide="mouse-pointer-2" class="w-3 h-3 inline mr-1"></i> Arrastra para rotar el modelo 3D
                    </div>
                    <!-- El Canvas de Three.js se inyectará aquí -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
